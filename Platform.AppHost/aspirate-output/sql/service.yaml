# Маніфест у форматі Aspirate (Platform.AppHost/aspirate-output/<ресурс>/...). Складено ВРУЧНУ за структурою `aspirate generate`; без секретів.
apiVersion: v1
kind: Service
metadata:
  name: sql
  namespace: technest
  labels:
    app: sql
spec:
  type: ClusterIP
  selector:
    app: sql
  ports:
    - name: main
      port: 1433
      targetPort: 1433
