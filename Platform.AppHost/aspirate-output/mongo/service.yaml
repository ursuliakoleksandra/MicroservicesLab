# Маніфест у форматі Aspirate (Platform.AppHost/aspirate-output/<ресурс>/...). Складено ВРУЧНУ за структурою `aspirate generate`; без секретів.
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: technest
  labels:
    app: mongo
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - name: main
      port: 27017
      targetPort: 27017
