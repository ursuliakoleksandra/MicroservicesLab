# Маніфест у форматі Aspirate (Platform.AppHost/aspirate-output/<ресурс>/...). Складено ВРУЧНУ за структурою `aspirate generate`; без секретів.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: technest
  labels:
    app: rabbitmq
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: main
      port: 5672
      targetPort: 5672
    - name: p15672
      port: 15672
      targetPort: 15672
