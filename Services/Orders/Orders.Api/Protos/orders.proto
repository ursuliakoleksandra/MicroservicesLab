syntax = "proto3";

// Контракт читання замовлень для внутрішніх сервісів (Aggregator).
// Номери полів не змінюються після публікації; видалені поля — `reserved`.

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Orders.Contracts";   // не "Orders.Grpc": простір імен Grpc затьмарив би Grpc.Core

package orders;

service OrdersService {
  // Замовлення з позиціями. Не знайдено -> NotFound, Id <= 0 -> InvalidArgument.
  rpc GetOrder (GetOrderRequest) returns (OrderReply);
}

message GetOrderRequest {
  int64 id = 1;
}

// Гроші без втрат точності: ціле + наносекундна частка.
message Money {
  int64 units = 1;
  int32 nanos = 2;
}

message OrderItemReply {
  int64 product_id = 1;
  string product_name = 2;     // знімок назви на момент замовлення
  Money unit_price = 3;        // знімок ціни на момент замовлення
  Money discount = 4;
  int32 units = 5;
  Money line_total = 6;
}

message OrderReply {
  int64 id = 1;
  int64 customer_id = 2;
  string status = 3;
  google.protobuf.Timestamp order_date = 4;   // UTC
  string shipping_address = 5;
  optional string comment = 6;                // optional: розрізняє «порожньо» і «немає»
  Money total = 7;
  string row_version = 8;                     // base64, для PUT .../details
  repeated OrderItemReply items = 9;
}
