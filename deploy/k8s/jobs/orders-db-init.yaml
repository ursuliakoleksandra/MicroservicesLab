# Рукописний маніфест (kubectl apply -k). Тут немає жодних секретів: паролі та рядки підключення лежать у Secret, який створює
# скрипт deploy/k8s/scripts/create-secrets.* командою `kubectl create secret generic` і який не потрапляє в Git.
apiVersion: batch/v1
kind: Job
metadata:
  name: orders-db-init
  namespace: technest
  labels:
    app: orders-db-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: orders-db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: orders-db-init
          image: technest/orders-db-init:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: orders-db-init-secrets
